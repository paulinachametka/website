    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"

<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <div class="scene">
      <svg class="cottage" viewBox="0 0 320 320" role="img"
        aria-label="A cozy little house with smoke curling from the chimney" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- hand-drawn wobble -->
          <filter id="sketch" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>

        <g filter="url(#sketch)" fill="none" stroke="#33302c" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">

          <!-- sun (day / dusk) -->
          <g class="sun">
            <circle cx="250" cy="66" r="17" fill="#f6c46a" />
            <g stroke-width="2.4" stroke="#e0a24e">
              <path d="M250,40 v-9" />
              <path d="M272,52 l7,-6" />
              <path d="M228,52 l-7,-6" />
              <path d="M276,66 h9" />
              <path d="M215,66 h-9" />
            </g>
          </g>

          <!-- moon + stars (night) -->
          <g class="moon">
            <circle cx="250" cy="70" r="17" fill="#efe3b0" />
            <circle cx="245" cy="66" r="2" fill="#33302c" stroke="none" />
            <circle cx="256" cy="74" r="1.6" fill="#33302c" stroke="none" />
          </g>
          <g class="stars" stroke-width="2.2">
            <path class="star star1" d="M74,58 v10 M69,63 h10" />
            <path class="star star2" d="M118,42 v8 M114,46 h8" />
            <path class="star star3" d="M210,50 v9 M205.5,54.5 h9" />
          </g>

          <!-- ground -->
          <path d="M70,264 q90,-12 180,0" stroke-width="2.5" />

          <!-- bushes -->
          <path fill="#a8c191" d="M64,264 q-4,-13 9,-15 q3,-11 13,-9 q11,-3 12,9 q11,1 7,15 z" />
          <path fill="#a8c191" d="M228,264 q-3,-14 10,-15 q4,-10 13,-8 q11,-2 11,10 q9,3 5,13 z" />

          <!-- chimney (behind roof) -->
          <path fill="#f2e6d2" d="M190,108 h16 v30 h-16 z" />

          <!-- smoke -->
          <g stroke-width="2.6">
            <path class="puff puff1" d="M198,104 c -9,-9 8,-15 0,-26 c -8,-9 8,-15 0,-25" />
            <path class="puff puff2" d="M198,104 c 9,-8 -7,-15 1,-25 c 8,-9 -6,-14 1,-23" />
          </g>

          <!-- roof -->
          <path fill="#dc8a63" d="M86,172 L160,104 L234,172 Z" />
          <path d="M96,168 q64,-10 128,0" stroke-width="2.2" stroke="#b46b46" />

          <!-- walls -->
          <path fill="#f7e8d2" d="M104,168 h112 v78 q0,4 -4,4 h-104 q-4,0 -4,-4 z" />

          <!-- door -->
          <path fill="#9cba8c" d="M146,250 v-30 q0,-14 14,-14 q14,0 14,14 v30 z" />
          <circle cx="168" cy="228" r="2.4" fill="#33302c" stroke="none" />

          <!-- window with warm glow -->
          <rect class="glow" x="116" y="188" width="28" height="28" rx="3" fill="#f4d488" />
          <path d="M130,188 v28 M116,202 h28" stroke-width="2.4" />

          <!-- tiny round attic window -->
          <circle class="glow" cx="160" cy="150" r="9" fill="#f4d488" />
        </g>
      </svg>
    </div>
